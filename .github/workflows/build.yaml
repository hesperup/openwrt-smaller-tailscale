name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"
          cache: false

      - name: Install UPX
        run: |
          # self-hosted arm64 runner：upx 官方 arm64_linux 版（bookworm 无 upx-ucl 包），走 gh-proxy 加速
          curl -fsSL -o /tmp/upx.tar.xz https://gh-proxy.com/https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-arm64_linux.tar.xz
          tar -C /tmp -xf /tmp/upx.tar.xz
          sudo install -m755 /tmp/upx-5.2.0-arm64_linux/upx /usr/local/bin/upx
          rm -rf /tmp/upx.tar.xz /tmp/upx-5.2.0-arm64_linux
          upx --version | head -1

      - name: Build for ${{ matrix.arch }}
        run: ./build.sh ${{ inputs.version }} ${{ matrix.arch }}

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    needs: [build]
    runs-on: [self-hosted, arm64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

