name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.2"
          cache: false

      - name: Install UPX
        run: |
          # self-hosted arm64 runner：用 apt 装 arm64 原生 upx（amd64 版二进制无法在此运行）
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --version | head -1

      - name: Build for ${{ matrix.arch }}
        run: ./build.sh ${{ inputs.version }} ${{ matrix.arch }}

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    needs: [build]
    runs-on: [self-hosted, arm64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

